[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-contour-studio"
version = "1.0.0"
description = "Professional Cross-Platform LiDAR Point Cloud Processing, DEM Gridding, Contour Extraction, and Engineering Reporting Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "band72" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "laspy[lazrs]>=2.5.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0"
]

[project.scripts]
lidar-contour-studio = "app.cli:main"
lidar-server = "run_server:main"
lidar-desktop = "packaging.option_1_desktop_app.desktop_launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "packaging*"]
