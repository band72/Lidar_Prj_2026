name: Build Windows Standalone EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller pywebview
          pip install -e .

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm LidarContourStudio_win.spec

      - name: Create Windows Distribution Zip
        run: |
          Compress-Archive -Path dist/LidarContourStudio/* -DestinationPath dist/LidarContourStudio-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidarContourStudio-Windows-x64
          path: dist/LidarContourStudio-Windows-x64.zip
